<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studeal</title>
  <style>
    :root { --bg:#f6f7fb; --card:#fff; --text:#1d2433; --muted:#6b7280; --accent:#4f46e5; --line:#e5e7eb; }
    [hidden] { display:none !important; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { background:var(--card); border-bottom:1px solid var(--line); padding:16px 20px; position:sticky; top:0; z-index:5; }
    .wrap { max-width:1000px; margin:0 auto; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    h1 { margin:0; font-size:24px; }
    .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .tab, .chip, .save, .login { border:1px solid var(--line); background:var(--card); padding:8px 14px; border-radius:999px; cursor:pointer; font:inherit; color:var(--text); text-decoration:none; }
    .tab.active, .chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    .login { background:var(--accent); border-color:var(--accent); color:#fff; }
    .search { width:100%; padding:10px 14px; border:1px solid var(--line); border-radius:10px; font:inherit; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0; }
    main { max-width:1000px; margin:20px auto; padding:0 20px; }
    .landing { max-width:600px; margin:60px auto; text-align:center; }
    .landing h2 { font-size:28px; }
    .landing p { color:var(--muted); line-height:1.5; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
    .card { background:var(--card); border-radius:14px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; flex-direction:column; }
    .card img, .placeholder { width:100%; height:140px; object-fit:cover; background:#eef0f6; }
    .placeholder { display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; }
    .body { padding:14px; display:flex; flex-direction:column; gap:6px; flex:1; }
    .venue { color:var(--muted); font-size:13px; }
    .title { font-weight:600; }
    .discount { display:inline-block; align-self:flex-start; background:#ecfdf5; color:#047857; padding:2px 8px; border-radius:6px; font-weight:600; font-size:13px; }
    .meta, .desc { color:var(--muted); font-size:14px; margin:0; }
    .save { align-self:flex-start; margin-top:6px; padding:6px 12px; font-size:14px; }
    .save.on { background:var(--accent); border-color:var(--accent); color:#fff; }
    .card a { color:var(--accent); font-size:14px; }
    .status { color:var(--muted); padding:20px 0; }
    .error { color:#b91c1c; }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="topbar">
      <h1>Studeal</h1>
      <div id="auth-box"></div>
    </div>
    <div data-auth="in" hidden>
      <div class="tabs">
        <a class="tab active" href="index.html">Знижки</a>
        <a class="tab" href="events.html">Події</a>
      </div>
      <div class="tabs">
        <button class="tab active" data-filter="all">Усі знижки</button>
        <button class="tab" data-filter="ucu">УКУ</button>
        <button class="tab" data-filter="saved">Збережені</button>
      </div>
      <div id="deal-filters">
        <input id="search" class="search" type="search" placeholder="Пошук: кава, спортзал, коворкінг…" />
        <div id="chips" class="chips"></div>
      </div>
    </div>
  </div>
</header>
<main class="wrap">
  <section class="landing" data-auth="out" hidden>
    <h2>Знижки і події для студентів Львова</h2>
    <p>Кав'ярні, коворкінги, спортзали, концерти й лекції, які дають знижку за студентським. Увійдіть, щоб переглянути пропозиції.</p>
    <button id="login-btn" class="login">Увійти</button>
  </section>
  <div data-auth="in" hidden>
    <div id="status" class="status"></div>
    <div id="deals" class="grid"></div>
  </div>
</main>

<script src="config.js"></script>
<script src="auth.js"></script>
<script>
const API = "http://localhost:8000/api";
const state = { filter: "all", university: "", category: "", q: "" };
let savedIds = new Set();

const els = {
  filterButtons: document.querySelectorAll("[data-filter]"),
  dealFilters: document.getElementById("deal-filters"),
  search: document.getElementById("search"),
  chips: document.getElementById("chips"),
  deals: document.getElementById("deals"),
  status: document.getElementById("status"),
};

async function request(path, { method = "GET", params = {} } = {}) {
  const qs = new URLSearchParams(
    Object.entries(params).filter(([, v]) => v)
  ).toString();
  const headers = {};
  const token = window.Studeal.getToken();
  if (token) headers.Authorization = `Bearer ${token}`;
  const res = await fetch(`${API}${path}${qs ? "?" + qs : ""}`, { method, headers });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return method === "GET" ? res.json() : null;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
}

function setStatus(text, isError = false) {
  els.status.className = isError ? "status error" : "status";
  els.status.textContent = text;
}

function renderCard(deal) {
  const card = el("article", "card");
  if (deal.image_url) {
    const img = el("img");
    img.src = deal.image_url;
    img.alt = deal.venue;
    img.loading = "lazy";
    card.append(img);
  } else {
    card.append(el("div", "placeholder", "Фото ще немає"));
  }
  const body = el("div", "body");
  body.append(el("div", "venue", deal.venue), el("div", "title", deal.title));
  if (deal.discount) body.append(el("span", "discount", deal.discount));
  if (deal.address) body.append(el("p", "meta", deal.address));
  if (deal.description) body.append(el("p", "desc", `Умови: ${deal.description}`));
  if (deal.valid_until) body.append(el("p", "meta", `Діє до ${deal.valid_until}`));
  if (deal.source_url) {
    const a = el("a", null, "Детальніше →");
    a.href = deal.source_url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    body.append(a);
  }
  const saved = savedIds.has(deal.id);
  const btn = el("button", saved ? "save on" : "save", saved ? "♥ Збережено" : "♡ Зберегти");
  btn.addEventListener("click", () => toggleSave(deal.id, !saved));
  body.append(btn);
  card.append(body);
  return card;
}

function makeChip(label, value) {
  const b = el("button", "chip", label);
  b.dataset.category = value;
  if (state.category === value) b.classList.add("active");
  b.addEventListener("click", () => {
    state.category = value;
    document.querySelectorAll(".chip").forEach((x) =>
      x.classList.toggle("active", x.dataset.category === value)
    );
    loadDeals();
  });
  return b;
}

async function loadCategories() {
  try {
    const categories = await request("/deals/categories");
    els.chips.innerHTML = "";
    els.chips.append(makeChip("Усі категорії", ""));
    categories.forEach((c) => els.chips.append(makeChip(c, c)));
  } catch (e) {
    setStatus("Не вдалося завантажити категорії.", true);
  }
}

async function loadDeals() {
  setStatus("Завантаження…");
  try {
    const saved = await request("/me/saved");
    savedIds = new Set(saved.map((d) => d.id));
    const deals = state.filter === "saved"
      ? saved
      : await request("/deals", {
          params: { category: state.category, university: state.university, q: state.q.trim() },
        });
    els.deals.innerHTML = "";
    if (deals.length === 0) {
      setStatus(state.filter === "saved" ? "Ви ще нічого не зберегли." : "Нічого не знайдено. Спробуйте інший запит.");
      return;
    }
    setStatus(`Знайдено: ${deals.length}`);
    deals.forEach((d) => els.deals.append(renderCard(d)));
  } catch (e) {
    setStatus("Помилка завантаження. Чи запущено API на localhost:8000?", true);
  }
}

async function toggleSave(id, on) {
  try {
    await request(`/me/saved/${id}`, { method: on ? "POST" : "DELETE" });
    loadDeals();
  } catch (e) {
    setStatus("Не вдалося зберегти. Спробуйте ще раз.", true);
  }
}

els.filterButtons.forEach((btn) =>
  btn.addEventListener("click", () => {
    const f = btn.dataset.filter;
    state.filter = f;
    state.university = f === "ucu" ? "ucu" : "";
    els.filterButtons.forEach((b) => b.classList.toggle("active", b === btn));
    els.dealFilters.hidden = f === "saved";
    loadDeals();
  })
);

let timer;
els.search.addEventListener("input", (e) => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    state.q = e.target.value;
    loadDeals();
  }, 300);
});

// Головна логіка: спершу перевіряємо вхід. Без входу жодного запиту до API немає.
async function start() {
  const signedIn = await window.Studeal.init();
  if (!signedIn) return;
  await loadCategories();
  loadDeals();
}
start();
</script>
</body>
</html>

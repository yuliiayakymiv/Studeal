AWSTemplateFormatVersion: "2010-09-09"
Description: Studeal sign-in (Lab 4 style) - Cognito user pool (email + password and Google), public PKCE client, managed login v2 with Studeal branding

Parameters:
  ProjectName:
    Type: String
    Default: studeal
  DomainPrefix:
    Type: String
    Description: Globally unique prefix for https://<prefix>.auth.eu-central-1.amazoncognito.com
  SiteUrl:
    Type: String
    Description: Deployed CloudFront origin without a trailing slash, e.g. https://d111111abcdef8.cloudfront.net
  LocalUrl:
    Type: String
    Default: http://localhost:5173
  GoogleClientId:
    Type: String
    Description: Google OAuth web client id (Google Cloud console -> Clients)
  GoogleClientSecret:
    Type: String
    NoEcho: true

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${ProjectName}-users
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      DeletionProtection: INACTIVE
      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping: # without this a Google user arrives with no email to show
        email: email
        email_verified: email_verified
        name: name

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProvider # the client names "Google"; it must exist first
    Properties:
      ClientName: !Sub ${ProjectName}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO, Google]
      CallbackURLs:
        - !Sub ${SiteUrl}/
        - !Sub ${LocalUrl}/
      LogoutURLs:
        - !Sub ${SiteUrl}/
        - !Sub ${LocalUrl}/
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref DomainPrefix
      ManagedLoginVersion: 2

  # >>> branding (generated by infra/branding/render.py — edit the files there, not here)
  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain # a v2 domain has no sign-in page without branding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient

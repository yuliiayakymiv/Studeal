AWSTemplateFormatVersion: "2010-09-09"
Description: Studeal sign-in (Lab 4 style) - Cognito user pool (email + password), public PKCE client, managed login v2

Parameters:
  ProjectName:
    Type: String
    Default: studeal
  DomainPrefix:
    Type: String
    Description: Globally unique prefix for https://<prefix>.auth.eu-central-1.amazoncognito.com
  SiteUrl:
    Type: String
    Description: Deployed CloudFront origin without a trailing slash, e.g. https://d111111abcdef8.cloudfront.net
  LocalUrl:
    Type: String
    Default: http://localhost:5173

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${ProjectName}-users
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      DeletionProtection: INACTIVE
      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${ProjectName}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub ${SiteUrl}/
        - !Sub ${LocalUrl}/
      LogoutURLs:
        - !Sub ${SiteUrl}/
        - !Sub ${LocalUrl}/
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref DomainPrefix
      ManagedLoginVersion: 2

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID (for backend person 1)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID; VITE_COGNITO_CLIENT_ID and COGNITO_CLIENT_ID
    Value: !Ref UserPoolClient
  Authority:
    Description: OIDC issuer URL; VITE_COGNITO_ISSUER and COGNITO_ISSUER
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  CognitoDomain:
    Description: Hosted UI / Managed login base URL; VITE_COGNITO_DOMAIN
    Value: !Sub https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com

"borderColor":"4f46e5ff","textColor":"1d2433ff"}}}}}
      Assets:
        - Category: FAVICON_SVG # favicon.svg
          ColorMode: LIGHT
          Extension: SVG
          Bytes: 
        - Category: FORM_LOGO # form-logo.svg
          ColorMode: LIGHT
          Extension: SVG
          Bytes: 
        - Category: PAGE_FOOTER_LOGO # footer-text.svg
          ColorMode: LIGHT
          Extension: SVG
          Bytes: 
        - Category: PAGE_BACKGROUND # page-background.svg
          ColorMode: LIGHT
          Extension: SVG
          Bytes: 
  # <<< branding

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID (for backend person 1)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID; VITE_COGNITO_CLIENT_ID and COGNITO_CLIENT_ID
    Value: !Ref UserPoolClient
  Authority:
    Description: OIDC issuer URL; VITE_COGNITO_ISSUER and COGNITO_ISSUER
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  CognitoDomain:
    Description: Hosted UI / Managed login base URL; VITE_COGNITO_DOMAIN
    Value: !Sub https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  GoogleRedirectUri:
    Description: Paste into the Google OAuth client as Authorised redirect URI
    Value: !Sub https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse
